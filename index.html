<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Атлас технологических схем НПЗ</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b2540;--p:#123a63;--ln:#2b5a8a;--tx:#e8f1fa;--mu:#9bb7d3;--am:#ffb347;--cy:#5fd0e8;--rd:#ff6b4a;--gn:#9be37a;--br:#c49a6c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 'Golos Text',system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:-60px;z-index:-1;background:linear-gradient(var(--ln) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--ln) 1px,transparent 1px) 0 0/48px 48px;opacity:.25;animation:drift 40s linear infinite}
@keyframes drift{to{transform:translate(48px,48px)}}
h1,h2,h3,.num{font-family:Unbounded,'Trebuchet MS',sans-serif;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px 60px}
.hero{max-width:1100px;margin:0 auto;padding:56px 20px 30px;display:flex;gap:40px;align-items:center;justify-content:space-between}
.hero h1{font-size:clamp(28px,5vw,48px);line-height:1.15;max-width:640px}
.hero p{color:var(--mu);max-width:560px;margin:16px 0 0}
.col-anim{flex:none;width:120px;height:210px;border:2px solid var(--cy);border-radius:60px/16px;position:relative;overflow:hidden;background:rgba(95,208,232,.06)}
.col-anim i{position:absolute;left:0;right:0;height:1px;background:var(--ln)}
.col-anim b{position:absolute;bottom:-10px;width:8px;height:8px;border-radius:50%;background:var(--am);animation:rise 4s ease-in infinite}
@keyframes rise{to{transform:translateY(-230px);opacity:0}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:24px;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s;position:relative;display:block;color:inherit;text-decoration:none}
.card:hover{transform:translateY(-6px);border-color:var(--am);box-shadow:0 14px 30px rgba(0,0,0,.35)}
.card h2{font-size:22px;margin:12px 0 8px}
.card p{color:var(--mu);margin:0 0 14px;font-size:15px}
.tag{display:inline-block;padding:2px 12px;border-radius:20px;font-size:13px;font-weight:600;background:var(--gn);color:#0b2540}
.tag.pl{background:transparent;border:1px solid var(--am);color:var(--am)}
.card.dis{cursor:default;opacity:.8}.card.dis:hover{transform:none;border-color:var(--ln);box-shadow:none}
.card.add{border-style:dashed;background:transparent;text-align:center;display:grid;place-items:center;cursor:default}
.card.add:hover{transform:none;border-color:var(--ln);box-shadow:none}
.card a{color:var(--cy)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 0;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:transparent;border:1px solid var(--cy);color:var(--cy);padding:8px 18px;border-radius:30px;transition:.2s}
.btn:hover{background:var(--cy);color:var(--bg)}
.btn:focus-visible,.chip:focus-visible,.nb:focus-visible,.st:focus-visible,.nd:focus-visible{outline:2px solid var(--am);outline-offset:2px}
.title h1{font-size:clamp(24px,4vw,40px)}.title p{color:var(--mu);max-width:760px}
section{margin-top:44px}
section>h2{font-size:22px;margin-bottom:6px}
section>.lead{color:var(--mu);margin:0 0 18px;max-width:760px}
.photo{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:12px}
.photo img{width:100%;display:block;border-radius:8px;cursor:zoom-in;background:#fff;min-height:60px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 20px;margin:14px 0 0;padding:0;list-style:none;font-size:14px;color:var(--mu)}
.legend b{color:var(--am);display:inline-block;min-width:38px}
#lb{position:fixed;inset:0;background:rgba(5,15,28,.94);display:none;z-index:9;overflow:auto;cursor:zoom-out}
#lb.on{display:block}#lb img{display:block;margin:20px auto;max-width:none;width:min(1800px,220vw);background:#fff}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.st{background:var(--p);border:1px solid var(--ln);border-radius:30px;padding:6px 16px;transition:.2s}
.st.on,.st:hover{border-color:var(--am);color:var(--am)}
.st.on{background:rgba(255,179,71,.12)}
.stext{background:var(--p);border-left:4px solid var(--am);border-radius:10px;padding:16px 20px;min-height:110px;margin-bottom:18px}
.stext h3{font-size:17px;margin-bottom:6px}.stext p{margin:0;color:var(--tx)}
.svgbox{background:#0a1f36;border:1px solid var(--ln);border-radius:14px;padding:10px;overflow-x:auto}
svg{display:block;width:100%;min-width:760px;height:auto}
svg text{font-family:'Golos Text',sans-serif;fill:var(--mu)}
.fl{fill:none;stroke-width:2;opacity:.4}
.o{--c:var(--am)}.v{--c:var(--cy)}.h{--c:var(--rd)}.m{--c:var(--br)}.g{--c:var(--gn)}
.fl{stroke:var(--c)}svg circle.dot{fill:var(--c)}
.nd{cursor:pointer}.nd rect.bx{fill:var(--p);stroke:var(--ln);stroke-width:1.5;transition:.25s}
.nd text{fill:var(--tx);font-weight:600;font-size:13px;pointer-events:none}
.nd:hover rect.bx{stroke:var(--cy)}
.nd.hl rect.bx{stroke:var(--am);fill:#2a4a66;filter:drop-shadow(0 0 7px rgba(255,179,71,.7))}
.nd.sel rect.bx{stroke:#fff;stroke-width:2.5;fill:#3a5f80}
.tray{stroke:var(--ln);stroke-width:1}
.ctl{display:flex;gap:10px;margin-top:10px;align-items:center;color:var(--mu);font-size:14px;flex-wrap:wrap}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:transparent;border:1px solid var(--ln);border-radius:20px;padding:3px 12px;font-size:14px;color:var(--mu)}
.chip.on{background:var(--cy);color:var(--bg);border-color:var(--cy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.nb{background:var(--p);border:1px solid var(--ln);border-radius:8px;padding:8px 0;font-weight:600;transition:.2s}
.nb:hover{border-color:var(--cy)}.nb.dim{opacity:.2}.nb.on{background:var(--am);color:var(--bg);border-color:var(--am)}
.det{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:22px;position:sticky;top:12px;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.det .num{font-size:44px;color:var(--am);line-height:1}
.det h3{font-size:18px;margin:8px 0 2px}.det small{color:var(--cy)}
.det h4{margin:16px 0 4px;font-size:14px;color:var(--mu)}
.det p{margin:0}

.ftab{background:var(--p);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.ftab>div{display:grid;grid-template-columns:56px 120px 1fr;gap:12px;padding:12px 16px;border-bottom:1px solid var(--ln)}
.ftab>div:last-child{border:0}.ftab b{color:var(--am);font-family:Unbounded,sans-serif}.ftab em{color:var(--mu);font-style:normal}
@media(max-width:760px){.ftab>div{grid-template-columns:48px 1fr}.ftab em{grid-column:1/3}}
footer{margin-top:50px;color:var(--mu);font-size:14px}footer a{color:var(--cy)}
@media(max-width:760px){.ex{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}.det{position:static}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function svg(s){

 s.edges.forEach(([c,p])=>{

  const dur=Math.max(1.5,len/55);
  d+=`<g class="${c}"><path class="fl" d="${path}"/>`;
  for(let i=0;i<3;i++)d+=`<circle class="dot" r="3.5"><animateMotion dur="${dur}s" begin="${-i*dur/3}s" repeatCount="indefinite" path="${path}"/></circle>`;
  d+='</g>';
 });
 s.cols.forEach(([k,x,y,w,h,l,nums])=>{

 st={sel:null,step:null,flt:'all'};
 app.innerHTML=`<div class="wrap"><div class="top"><button class="btn" id="back">← Все схемы</button><a class="btn" href="${s.src}" target="_blank" rel="noopener" style="text-decoration:none">Источник</a></div>
 <div class="title"><h1>${s.title}</h1><p>${s.sub}. ${s.intro}</p></div>
 <section><h2>Схема установки</h2><p class="lead">Нажмите на фото, чтобы открыть его крупно.</p>
 <div class="photo"><img id="ph" src="${s.img[0]}" alt="Технологическая схема ${s.title}"><ul class="legend">${s.streams.map(q=>`<li><b>${q[0]}</b>${q[1]}</li>`).join('')}</ul></div></section>
 <section><h2>Как это работает</h2><p class="lead">Пройдите путь нефти по шагам: аппараты на схеме ниже подсвечиваются.</p>
 <div class="steps">${s.steps.map((x,i)=>`<button class="st" data-i="${i}">${i+1}. ${x[0]}</button>`).join('')}</div>
 <div class="stext" id="stext"><h3>Выберите шаг</h3><p>Цветные точки показывают движение потоков: жёлтые — нефть, красные — горячая нефть, голубые — пары, зелёные — бензин и готовые фракции, коричневые — мазут.</p></div>
 <div class="svgbox">${svg(s)}</div>
 <div class="ctl"><button class="btn" id="pz">Остановить потоки</button><span>Нажимайте на аппараты, чтобы прочитать о них.</span></div></section>
 ${bsec(s)}
 <section><h2>Справочник оборудования</h2><p class="lead">Каждый номер со схемы: что это и как устроено.</p>
 <div class="ex"><div><div class="chips"><button class="chip on" data-f="all">Все</button>${Object.entries(T).map(([k,v])=>`<button class="chip" data-f="${k}">${v[0]}</button>`).join('')}</div>
 <div class="grid">${order.map(n=>`<button class="nb" data-n="${n}" data-t="${map[n][1]}">${n}</button>`).join('')}</div></div>
 <div class="det" id="det"><div class="num">?</div><h3>Выберите номер</h3><p>Нажмите на аппарат на схеме или на номер слева.</p></div></div></section>
 <footer>Описание построено по материалам <a href="${s.src}" target="_blank" rel="noopener">источника схемы</a>.</footer></div>`;
 const ph=$('#ph');ph.onerror=()=>{if(!ph.dataset.f){ph.dataset.f=1;ph.src=s.img[1]}else ph.alt='Фото не загрузилось: положите файл '+s.img[0]};
 ph.onclick=()=>{$('#lbi').src=ph.src;$('#lb').classList.add('on')};
 $('#back').onclick=()=>location.hash='';
 const paint=()=>{
  document.querySelectorAll('.nd').forEach(g=>{
   const ns=g.dataset.n.split(',');
   g.classList.toggle('sel',st.sel&&ns.includes(st.sel));
   g.classList.toggle('hl',st.step!=null&&ns.some(n=>s.steps[st.step][2].includes(n)));
  });
  document.querySelectorAll('.nb').forEach(b=>{b.classList.toggle('on',b.dataset.n===st.sel);b.classList.toggle('dim',st.flt!=='all'&&b.dataset.t!==st.flt)});
  document.querySelectorAll('.st').forEach(b=>b.classList.toggle('on',+b.dataset.i===st.step));
 };
 const pick=n=>{
  st.sel=n;const it=map[n];if(!it)return;const t=T[it[1]];
  const d=$('#det');d.style.animation='none';d.offsetHeight;d.style.animation='';
  d.innerHTML=`<div class="num">${n}</div><h3>${it[2]}</h3><small>${t[0]}</small><h4>Роль в схеме</h4><p>${it[3]}</p><h4>Как это работает вообще</h4><p>${t[1]}</p>`;
  paint();
 };
 app.onclick=e=>{
  const g=e.target.closest('.nd'),b=e.target.closest('.nb'),c=e.target.closest('.chip'),sp=e.target.closest('.st');
  if(g)pick(g.dataset.n.split(',')[0]);
  else if(b)pick(b.dataset.n);
  else if(c){document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));st.flt=c.dataset.f;paint()}
  else if(sp){st.step=+sp.dataset.i;const x=s.steps[st.step];$('#stext').innerHTML=`<h3>${st.step+1}. ${x[0]}</h3><p>${x[1]}</p>`;paint()}
  else if(e.target.id==='pz'){const v=$('svg'),p=e.target.dataset.p!=='1';p?v.pauseAnimations():v.unpauseAnimations();e.target.dataset.p=p?'1':'0';e.target.textContent=p?'Запустить потоки':'Остановить потоки'}
 };
 app.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('nd')){e.preventDefault();pick(e.target.dataset.n.split(',')[0])}};
}
$('#lb').onclick=()=>$('#lb').classList.remove('on');
addEventListener('hashchange',route);route();
</script>
</body>
</html>
